name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests (content schema + contrast)
        run: npm test

      - name: Build
        run: npm run build
      - name: JS budget
        run: npm run check:budget

      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Accessibility + responsive smoke
        run: npm run test:e2e

      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.14.x autorun
      - name: Lighthouse metrics
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            for (const f of fs.readdirSync(".lighthouseci").filter((n) => n.startsWith("lhr-") && n.endsWith(".json"))) {
              const d = JSON.parse(fs.readFileSync(".lighthouseci/" + f, "utf8")); const a = d.audits;
              const m = (id) => Math.round(a[id].numericValue);
              console.log(Object.entries(d.categories).map(([k, v]) => k + "=" + v.score).join(" "), "FCP", m("first-contentful-paint"), "LCP", m("largest-contentful-paint"), "SI", m("speed-index"), "TBT", m("total-blocking-time"), "CLS", a["cumulative-layout-shift"].numericValue.toFixed(4));
            }'
